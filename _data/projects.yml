# -----------------------------------------------------------------------------
# All papers, tutorials, workshops and code: the single source of truth.
#
# Every page reads from this file:
#   publications page  type: paper (by year), then tutorials and workshops
#   about page         entries with  selected: true
#   projects page      entries with  project: research | code
#   CV                 tutorials and workshops under "Teaching & Talks",
#                      papers under "Publications"
#   news               news items can point at an entry by its id
#
# Keep entries newest first; pages list them in this order.
#
# Fields (only id, type and title are required)
#   id           Unique slug. Used for page anchors and news references.
#   type         paper | tutorial | workshop | software
#   title        Full title.
#   short_title  Shorter name for cards and news (defaults to title).
#   year         Year of publication / presentation.
#   period       Shown instead of a year for undated items (e.g. "Recurring").
#   authors      List of names. Your name (from _config.yml) is underlined.
#   kind         Format label shown before the venue (e.g. "Official tutorial").
#   venue        Venue or host.
#   venue_note   Extra detail after the venue (track, "Extended abstract", ...).
#   location     City, for talks and tutorials.
#   badge        Short label in the colored box (e.g. "NeurIPS").
#   status       e.g. "Accepted, forthcoming".
#   topic        Research area, shown on project cards.
#   summary      One or two sentences for project cards and the CV.
#   stats        Optional headline numbers for the project card.
#   note         Optional footnote for the project card.
#   links        List of { label, url }. Shown as buttons everywhere.
#   bibtex       Citation; adds a "Bib" button with copy.
#   selected     true to feature on the about page.
#   project      research | code  to list on the projects page.
# -----------------------------------------------------------------------------

- id: ciphergrid
  type: paper
  title: "CIPHERGRID Benchmark: From Multimodal Rule Inference to Sequential Action"
  short_title: CIPHERGRID
  year: 2026
  authors:
    - Christopher Curtis
    - Victor Fragoso
    - Saiph Savage
  venue: Advances in Neural Information Processing Systems (NeurIPS)
  venue_note: Evaluations & Datasets Track
  badge: NeurIPS
  status: Accepted, forthcoming
  topic: AI evaluation
  summary: >-
    A controlled benchmark for multimodal rule inference and sequential
    action: can a model infer an unfamiliar symbolic world from examples,
    keep its rules straight, and use them to act? Even capable models
    struggle to integrate skills they can perform individually.
  stats: 635 benchmark problems · 41.89% best model accuracy*
  note: >-
    *As reported in the current public benchmark card; results depend on
    evaluation configuration.
  links:
    - label: Dataset
      url: https://huggingface.co/datasets/AnonCC7/CIPHERGRID
    - label: Code
      url: https://github.com/CurtisChris7/CIPHERGRID
  bibtex: |-
    @inproceedings{curtis2026ciphergrid,
      title     = {{CIPHERGRID} Benchmark: From Multimodal Rule Inference to Sequential Action},
      author    = {Curtis, Christopher and Fragoso, Victor and Savage, Saiph},
      booktitle = {Advances in Neural Information Processing Systems},
      year      = {2026},
      note      = {Accepted, Evaluations and Datasets Track}
    }
  selected: true
  project: research

